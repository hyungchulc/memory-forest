[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-forest"
version = "0.1.0"
description = "A local, provenance-aware memory architecture for long-running AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hyungchul Choi" },
]
keywords = [
  "agents",
  "ai-memory",
  "knowledge-management",
  "local-first",
  "provenance",
  "retrieval",
  "sqlite",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hyungchulc/memory-forest"
Repository = "https://github.com/hyungchulc/memory-forest"
Issues = "https://github.com/hyungchulc/memory-forest/issues"

[project.scripts]
memory-forest = "memory_forest.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
