name: Bug report
description: Report a reproducible problem in the CLI or contracts
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach a real forest or private memory body. Use a minimal synthetic fixture.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands and a synthetic directory layout.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
