<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Target operating model for automated Memory Forest maintenance</title>
  <desc id="desc">The implemented lane schedules deterministic validation and atomic index rebuilding. A separate future integration lane prepares evidence for reviewed semantic promotion. No scheduler automatically promotes memory.</desc>
  <rect width="1200" height="720" fill="#f7f4ed"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="58" y="55" fill="#20222a" font-size="29" font-weight="700">Automated Memory Forest</text>
    <text x="58" y="84" fill="#5c6070" font-size="15">Implemented maintenance on the left, future external integration on the right</text>

    <rect x="50" y="112" width="535" height="520" rx="18" fill="#ffffff" stroke="#4059b5" stroke-width="2"/>
    <rect x="615" y="112" width="535" height="520" rx="18" fill="#ffffff" stroke="#a9adbb" stroke-width="2" stroke-dasharray="8 7"/>

    <text x="78" y="150" fill="#4059b5" font-size="14" font-weight="700">CURRENT / IMPLEMENTED</text>
    <text x="643" y="150" fill="#6b6f7d" font-size="14" font-weight="700">FUTURE / EXTERNAL INTEGRATION</text>

    <g font-size="13" font-weight="650" text-anchor="middle">
      <rect x="78" y="178" width="132" height="38" rx="19" fill="#e9ecf7"/>
      <text x="144" y="202" fill="#303340">POSIX cron</text>
      <rect x="222" y="178" width="132" height="38" rx="19" fill="#e9ecf7"/>
      <text x="288" y="202" fill="#303340">macOS launchd</text>
      <rect x="366" y="178" width="190" height="38" rx="19" fill="#e9ecf7"/>
      <text x="461" y="202" fill="#303340">Codex Scheduled Task</text>
    </g>

    <path d="M317 226V254" stroke="#4059b5" stroke-width="3"/>
    <path d="M309 246L317 258L325 246" fill="none" stroke="#4059b5" stroke-width="3"/>

    <rect x="126" y="268" width="382" height="64" rx="12" fill="#f7f8fc" stroke="#4059b5" stroke-width="2"/>
    <text x="317" y="294" fill="#20222a" font-size="17" font-weight="700" text-anchor="middle">external maintenance lock</text>
    <text x="317" y="316" fill="#5c6070" font-size="13" text-anchor="middle">one exact private forest root, fail closed on overlap</text>

    <path d="M317 340V368" stroke="#4059b5" stroke-width="3"/>
    <path d="M309 360L317 372L325 360" fill="none" stroke="#4059b5" stroke-width="3"/>

    <rect x="126" y="382" width="382" height="74" rx="12" fill="#4059b5"/>
    <text x="317" y="412" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">validate + audit + atomic index</text>
    <text x="317" y="437" fill="#eef1ff" font-size="13" text-anchor="middle">implemented by the current CLI</text>

    <path d="M317 464V492" stroke="#4059b5" stroke-width="3"/>
    <path d="M309 484L317 496L325 484" fill="none" stroke="#4059b5" stroke-width="3"/>

    <rect x="126" y="506" width="382" height="74" rx="12" fill="#f7f8fc" stroke="#4059b5" stroke-width="2"/>
    <text x="317" y="536" fill="#20222a" font-size="17" font-weight="700" text-anchor="middle">private derived SQLite index</text>
    <text x="317" y="559" fill="#5c6070" font-size="13" text-anchor="middle">metadata-only route / retrieve</text>

    <rect x="78" y="592" width="478" height="24" rx="12" fill="#fff1dc"/>
    <text x="317" y="609" fill="#7b5318" font-size="12" font-weight="650" text-anchor="middle">Codex uses the selected account and model processing boundary</text>

    <rect x="720" y="177" width="326" height="58" rx="12" fill="#f6f6f8" stroke="#a9adbb" stroke-width="2"/>
    <text x="883" y="202" fill="#20222a" font-size="16" font-weight="700" text-anchor="middle">06 ISTM / source evidence</text>
    <text x="883" y="222" fill="#5c6070" font-size="12" text-anchor="middle">bounded admission required</text>

    <path d="M883 243V266" stroke="#7c8190" stroke-width="3"/>
    <path d="M875 258L883 270L891 258" fill="none" stroke="#7c8190" stroke-width="3"/>

    <rect x="720" y="280" width="326" height="68" rx="12" fill="#f6f6f8" stroke="#a9adbb" stroke-width="2"/>
    <text x="883" y="307" fill="#20222a" font-size="16" font-weight="700" text-anchor="middle">candidate packet</text>
    <text x="883" y="330" fill="#5c6070" font-size="12" text-anchor="middle">sources + hashes + conflicts + uncertainty</text>

    <path d="M883 356V379" stroke="#7c8190" stroke-width="3"/>
    <path d="M875 371L883 383L891 371" fill="none" stroke="#7c8190" stroke-width="3"/>

    <rect x="720" y="393" width="326" height="68" rx="12" fill="#fff7ea" stroke="#c58a32" stroke-width="2"/>
    <text x="883" y="420" fill="#6c4918" font-size="16" font-weight="700" text-anchor="middle">accountable review</text>
    <text x="883" y="443" fill="#7b5b30" font-size="12" text-anchor="middle">human or governed agent decision</text>

    <path d="M883 469V492" stroke="#7c8190" stroke-width="3"/>
    <path d="M875 484L883 496L891 484" fill="none" stroke="#7c8190" stroke-width="3"/>

    <rect x="720" y="506" width="326" height="74" rx="12" fill="#f6f6f8" stroke="#a9adbb" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="883" y="534" fill="#20222a" font-size="16" font-weight="700" text-anchor="middle">integrator-owned canonical writer</text>
    <text x="883" y="556" fill="#9a3232" font-size="13" font-weight="700" text-anchor="middle">NOT IN THE CURRENT CLI</text>

    <text x="883" y="608" fill="#303340" font-size="13" font-weight="650" text-anchor="middle">05 Daily -&gt; 04 STM -&gt; 03 MTM -&gt; 02 LTM -&gt; 01 XLTM</text>
    <text x="883" y="626" fill="#5c6070" font-size="12" text-anchor="middle">00 Life Archive remains a separate optional selection lane</text>

    <path d="M720 543H508" fill="none" stroke="#4059b5" stroke-width="3" stroke-dasharray="7 6"/>
    <path d="M520 535L508 543L520 551" fill="none" stroke="#4059b5" stroke-width="3"/>

    <rect x="250" y="658" width="700" height="38" rx="19" fill="#f9e4e4" stroke="#c44c4c" stroke-width="1.5"/>
    <text x="600" y="682" fill="#8d2f2f" font-size="16" font-weight="750" text-anchor="middle">No scheduler equals automatic promotion</text>
  </g>
</svg>
